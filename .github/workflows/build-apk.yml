name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Verifying Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -nE 's/.*version "([0-9]+).*/\1/p')

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Could not detect Java major version from output:" >&2
            echo "$JAVA_VERSION_OUTPUT" >&2
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required. Found version: $JAVA_MAJOR" >&2
            exit 1
          fi
          echo "Java environment verified successfully (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "=== Checking / Generating Debug Keystore ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "ERROR: Failed to create ./debug.keystore" >&2
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: |
          echo "=== Building Debug APK ==="
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== Verifying APK Existence and Validity ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK" >&2
            echo "Searching discovered APKs inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: APK at $EXPECTED_APK is empty (0 bytes)." >&2
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension: $EXPECTED_APK" >&2; exit 1 ;;
          esac

          echo "APK successfully verified: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing APK Release Asset ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Source APK missing or empty at $EXPECTED_APK" >&2
            exit 1
          fi

          TEMP_RELEASE_DIR="${RUNNER_TEMP:-/tmp}/release-assets-${{ github.run_id }}"
          mkdir -p "$TEMP_RELEASE_DIR"

          REPO_RAW="${{ github.repository }}"
          REPO_NAME=$(basename "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_ASSET_PATH="$TEMP_RELEASE_DIR/$RELEASE_FILENAME"

          cp "$EXPECTED_APK" "$DEST_ASSET_PATH"

          if [ ! -f "$DEST_ASSET_PATH" ] || [ ! -s "$DEST_ASSET_PATH" ]; then
            echo "ERROR: Failed to copy APK to $DEST_ASSET_PATH" >&2
            exit 1
          fi

          echo "Release asset prepared: $DEST_ASSET_PATH ($RELEASE_FILENAME)"
          echo "asset_path=$DEST_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version

          RELEASE_ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$RELEASE_ASSET_PATH" ] || [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at '$RELEASE_ASSET_PATH'" >&2
            exit 1
          fi

          case "$RELEASE_ASSET_PATH" in
            *.apk) ;;
            *) echo "ERROR: Release asset is not an APK file: $RELEASE_ASSET_PATH" >&2; exit 1 ;;
          esac

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          BODY_TEXT=$(cat <<'EOF'
          ### Debug APK Build Details
          - **Build Type**: Automatically generated debug APK
          - **Build System**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}
          - **Note**: This APK is intended for testing purposes and is not a Play Store production release. Signed with temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$RELEASE_ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$BODY_TEXT" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Release & Artifact Status Summary ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release published successfully."
            gh release view "$TAG_NAME" || true
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}"
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Name: $ASSET_NAME"

            {
              echo "## 📱 Debug APK Build & Release Succeeded"
              echo ""
              echo "### Direct Download via GitHub Releases"
              echo "- **Release Page**: [$TAG_NAME]($RELEASE_URL)"
              echo "- **Asset Filename**: \`$ASSET_NAME\`"
              echo "- The APK can be downloaded directly on your phone from the release **Assets** section."
              echo ""
              echo "### Actions Artifact Backup"
              echo "- The artifact **\`app-debug-apk\`** was also uploaded and is available in the GitHub Actions run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not complete or encountered an error."
            echo "APK build and artifact upload completed successfully."
            echo "The debug APK is available as a workflow artifact named 'app-debug-apk'."

            {
              echo "## 📱 Debug APK Build Succeeded"
              echo ""
              echo "> ⚠️ **GitHub Release Notice**: Release publishing did not complete or was skipped. However, the APK build succeeded and the artifact is ready."
              echo ""
              echo "### Actions Artifact Download"
              echo "- **Artifact Name**: \`app-debug-apk\`"
              echo "- You can download \`app-debug-apk\` directly from the **Artifacts** section at the bottom of this Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
